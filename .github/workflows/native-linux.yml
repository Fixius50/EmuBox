name: Native Linux
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: x86_64
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            architecture: aarch64
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      BUILD_ARCH: ${{ matrix.architecture }}
      TARGET: ${{ matrix.target }}
      EMUBOX_LOG_DIR: ${{ github.workspace }}/build-logs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify native runner
        run: |
          source installer/lib/architecture.sh
          test "$(get_emubox_architecture)" = "$BUILD_ARCH"
          rustc -vV
      - name: Native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev libayatana-appindicator3-dev patchelf file
      - name: Frontend contracts and tests
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm test
          npm run test:architecture
          npm run arch:check
          npm run mojibake:check
      - name: Native build
        run: bash scripts/build.sh
      - name: Native Rust tests
        run: |
          cargo check --manifest-path src-tauri/Cargo.toml --target "$TARGET"
          cargo test --manifest-path src-tauri/Cargo.toml --target "$TARGET"
      - name: Verify artifact
        run: |
          source installer/lib/architecture.sh
          validate_emubox_binary "bin/emubox-linux-$BUILD_ARCH" "$BUILD_ARCH"
          file "bin/emubox-linux-$BUILD_ARCH"
          cd bin
          sha256sum "emubox-linux-$BUILD_ARCH" > "emubox-linux-$BUILD_ARCH.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: emubox-linux-${{ matrix.architecture }}
          path: |
            bin/emubox-linux-${{ matrix.architecture }}
            bin/emubox-linux-${{ matrix.architecture }}.sha256
          if-no-files-found: error
