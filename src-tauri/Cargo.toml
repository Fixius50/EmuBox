[package]
name = "emubox"
version = "1.0.0"
description = "EmuBox OS - Dedicated Console Environment for Arch Linux"
authors = ["Fixius50"]
edition = "2021"

[lib]
name = "emubox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
tokio = { version = "1.0", default-features = false, features = ["macros", "rt", "time"] }
sysinfo = "0.30"
log = "0.4"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
walkdir = "2.5"
rusqlite = "0.32"
notify = "6.1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls", "multipart", "form", "query", "json"] }
ring = "0.17"
libc = "0.2"
sha2 = "0.10"
base64 = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }
compress-tools = "0.16.1"

[profile.dev]
incremental = true

# Dependencias externas optimizadas para que el runtime de dev sea fluido
[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 2
codegen-units = 16
incremental = true
lto = "off"
debug = false
panic = "abort"
strip = true

[profile.release.build-override]
opt-level = 0
codegen-units = 16
