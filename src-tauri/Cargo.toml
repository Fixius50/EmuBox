[package]
name = "emubox"
version = "1.0.0"
description = "EmuBox OS - Dedicated Console Environment for Arch Linux"
authors = ["Fixius50"]
edition = "2021"

[lib]
name = "emubox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.0", default-features = false, features = ["macros", "rt", "time"] }
sysinfo = "0.30"
log = "0.4"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
walkdir = "2.5"
rusqlite = { version = "0.32", features = ["bundled"] }
notify = "6.1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "multipart"] }
ring = "0.17"
libc = "0.2"
sha2 = "0.10"
base64 = "0.22"
zip = { version = "2", default-features = false, features = ["deflate-flate2"] }
compress-tools = "0.16.1"
